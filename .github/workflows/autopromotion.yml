name: Auto Promotion Branches

on:
  push:   # you can switch back to schedule/dispatch later
    branches:
      - dev
      - rudev
      - rutest

jobs:
  promote-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for merges
          token: ${{ secrets.AUTOPROMOTION_PAT }} # Replace with your PAT secret

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # -------------------------
      # Merge dev → rudev
      # -------------------------
      - name: Promote dev → rudev
        run: |
          git fetch origin
          if [ $(git rev-list origin/rudev..origin/dev --count) -gt 0 ]; then
            echo "Merging dev → rudev..."
            git checkout rudev
            git merge origin/dev --no-edit -X theirs || { echo "Conflict detected"; exit 1; }

            # Cleanup unwanted files
            rm -f .github/workflows/autopromotion.yml
            rm -f .github/workflows/dev.yml

            git add .github/workflows/ || true
            git commit -m "Cleanup after dev → rudev merge" || echo "No changes to commit"
            git push origin rudev
          else
            echo "No updates from dev → rudev"
          fi

      # -------------------------
      # Merge rudev → rutest
      # -------------------------
      - name: Promote rudev → rutest
        run: |
          git fetch origin
          if [ $(git rev-list origin/rutest..origin/rudev --count) -gt 0 ]; then
            echo "Merging rudev → rutest..."
            git checkout rutest
            git merge origin/rudev --no-edit -X theirs || { echo "Conflict detected"; exit 1; }

            # Cleanup unwanted files
            rm -f .github/workflows/autopromotion.yml
            rm -f .github/workflows/rudev.yml

            git add .github/workflows/ || true
            git commit -m "Cleanup after rudev → rutest merge" || echo "No changes to commit"
            git push origin rutest
          else
            echo "No updates from rudev → rutest"
          fi